syntax = "proto3";
package techaro.lol.reputationdb.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/visibility.proto";
import "google/protobuf/timestamp.proto";

service ReputationService {
  rpc Query(QueryRequest) returns (QueryResponse) {
    option (google.api.http) = {
      post: "/api/v1/query"
      body: "*"
    };
    option (google.api.method_visibility).restriction = "PUBLIC";
  }
}

message QueryRequest {
  option (google.api.message_visibility).restriction = "PUBLIC";
  option (gnostic.openapi.v3.schema) = {
    title: "Query Request"
    description: "A batch of IP addresses to look up in the reputation database. Addresses that have no record are omitted from the response instead of being returned empty."
  };

  repeated string ip_addresses = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "ip_address.is_ip_address"
      message: "ip_address must be an IP address"
      expression: "this.isIp()"
    },
    (gnostic.openapi.v3.property) = {
      title: "IP addresses"
      minimum: 1
      maximum: 100
      description: "IP addresses in string format without CIDR prefix"
    }
  ];
}

message ListMembership {
  option (google.api.message_visibility).restriction = "PUBLIC";
  option (gnostic.openapi.v3.schema) = {
    title: "List Membership"
    description: "The reason an IP address was added into the database such as the repository it was imported from or the manual report made by an administrator."
  };

  string repository = 1 [(gnostic.openapi.v3.property) = {
    title: "Repository"
    description: "Metadata about where this match originates from such as the GitHub repository or third party source that was imported"
  }];
  string list = 2 [(gnostic.openapi.v3.property) = {
    title: "List"
    description: "The name of the exact list the IP address was found in"
  }];
  string provider = 3 [(gnostic.openapi.v3.property) = {
    title: "Provider"
    description: "The provider or source of this IP address, such as the organization for a manual report or the hosting provider"
  }];
  string category = 4 [(gnostic.openapi.v3.property) = {
    title: "Category"
    description: "The main category of this IP address such as abuse, vpn, proxy, etc."
  }];
}

message Record {
  option (google.api.message_visibility).restriction = "PUBLIC";
  option (gnostic.openapi.v3.schema) = {
    title: "Database Record"
    description: "The database record for an IP address including the categories, providers, and list membership metadata"
  };

  string ip_address = 1 [(gnostic.openapi.v3.property) = {
    title: "IP Address"
    description: "The IP address for this record (functions as the primary key)"
  }];
  bool is_vpn = 2 [(gnostic.openapi.v3.property) = {
    title: "Is VPN"
    description: "True if the IP address is in a VPN IP list"
  }];
  bool is_datacenter = 3 [(gnostic.openapi.v3.property) = {
    title: "Is Datacenter IP"
    description: "True if the IP address is known to be associated with a datacenter range."
  }];
  bool is_crawler = 4 [(gnostic.openapi.v3.property) = {
    title: "Is Crawler"
    description: "True if the IP address is a known crawler (good or bad)"
  }];
  bool is_proxy = 5 [(gnostic.openapi.v3.property) = {
    title: "Is Open Proxy"
    description: "True if the IP address is in a known open proxy list"
  }];
  repeated string categories = 6 [(gnostic.openapi.v3.property) = {
    title: "Categories"
    description: "All of the categories in every list membership for this IP address"
  }];
  repeated string providers = 7 [(gnostic.openapi.v3.property) = {
    title: "Report Providers"
    description: "All of the list providers for this IP address"
  }];
  repeated ListMembership sources = 8 [(gnostic.openapi.v3.property) = {
    title: "List Memberships"
    description: "Detailed list membership metadata so administrators can make informed decisions about the risk for an IP address"
  }];
}

message QueryResponse {
  option (google.api.message_visibility).restriction = "PUBLIC";
  option (gnostic.openapi.v3.schema) = {
    title: "Query Response"
    description: "The database records matching the requested IP addresses, along with the age of the database snapshot they were read from."
  };

  google.protobuf.Timestamp database_created_at = 1 [(gnostic.openapi.v3.property) = {
    title: "Database Created At"
    description: "When the database snapshot that served this query was built, so clients can tell how stale the results are"
  }];
  repeated Record records = 2 [(gnostic.openapi.v3.property) = {
    title: "Records"
    description: "One record per IP address that was found in the database; requested addresses with no record are omitted"
  }];
}
