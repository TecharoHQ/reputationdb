openapi: 3.1.0
info:
  title: Techaro reputationdb API
  description: The API for managing, querying, and updating your reputation database checkout
  contact:
    name: Techaro
    url: https://github.com/TecharoHQ/reputationdb
  license:
    name: MIT License
    url: https://github.com/TecharoHQ/reputationdb/blob/main/LICENSE
  version: 0.0.1
paths:
  /api/v1/database:
    get:
      tags:
        - techaro.lol.reputationdb.fetch.v1.FetchService
      summary: List
      operationId: techaro.lol.reputationdb.fetch.v1.FetchService.List
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/techaro.lol.reputationdb.fetch.v1.ListResponse'
  /api/v1/database/free/fetch:
    get:
      tags:
        - techaro.lol.reputationdb.free.fetch.v1.FetchService
      summary: Fetch
      operationId: techaro.lol.reputationdb.free.fetch.v1.FetchService.Fetch
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/techaro.lol.reputationdb.free.fetch.v1.FetchResponse'
  /api/v1/database/{version_id}/fetch:
    get:
      tags:
        - techaro.lol.reputationdb.fetch.v1.FetchService
      summary: Fetch
      operationId: techaro.lol.reputationdb.fetch.v1.FetchService.Fetch
      parameters:
        - name: version_id
          in: path
          description: The version ID of the database to download, as returned by the list endpoint
          required: true
          schema:
            type: string
            title: Version ID
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/techaro.lol.reputationdb.fetch.v1.FetchResponse'
  /api/v1/database/{version_id}/info:
    get:
      tags:
        - techaro.lol.reputationdb.fetch.v1.FetchService
      summary: Info
      operationId: techaro.lol.reputationdb.fetch.v1.FetchService.Info
      parameters:
        - name: version_id
          in: path
          description: The version ID of the database to describe, as returned by the list endpoint
          required: true
          schema:
            type: string
            title: Version ID
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/techaro.lol.reputationdb.fetch.v1.InfoResponse'
  /api/v1/query:
    post:
      tags:
        - techaro.lol.reputationdb.v1.ReputationService
      summary: Query
      operationId: techaro.lol.reputationdb.v1.ReputationService.Query
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/techaro.lol.reputationdb.v1.QueryRequest'
          application/proto:
            schema:
              $ref: '#/components/schemas/techaro.lol.reputationdb.v1.QueryRequest'
        required: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/techaro.lol.reputationdb.v1.QueryResponse'
components:
  schemas:
    google.protobuf.Duration:
      type: string
      format: duration
      description: |-
        A Duration represents a signed, fixed-length span of time represented
         as a count of seconds and fractions of seconds at nanosecond
         resolution. It is independent of any calendar and concepts like "day"
         or "month". It is related to Timestamp in that the difference between
         two Timestamp values is a Duration and it can be added or subtracted
         from a Timestamp. Range is approximately +-10,000 years.

         # Examples

         Example 1: Compute Duration from two Timestamps in pseudo code.

             Timestamp start = ...;
             Timestamp end = ...;
             Duration duration = ...;

             duration.seconds = end.seconds - start.seconds;
             duration.nanos = end.nanos - start.nanos;

             if (duration.seconds < 0 && duration.nanos > 0) {
               duration.seconds += 1;
               duration.nanos -= 1000000000;
             } else if (duration.seconds > 0 && duration.nanos < 0) {
               duration.seconds -= 1;
               duration.nanos += 1000000000;
             }

         Example 2: Compute Timestamp from Timestamp + Duration in pseudo code.

             Timestamp start = ...;
             Duration duration = ...;
             Timestamp end = ...;

             end.seconds = start.seconds + duration.seconds;
             end.nanos = start.nanos + duration.nanos;

             if (end.nanos < 0) {
               end.seconds -= 1;
               end.nanos += 1000000000;
             } else if (end.nanos >= 1000000000) {
               end.seconds += 1;
               end.nanos -= 1000000000;
             }

         Example 3: Compute Duration from datetime.timedelta in Python.

             td = datetime.timedelta(days=3, minutes=10)
             duration = Duration()
             duration.FromTimedelta(td)

         # JSON Mapping

         In JSON format, the Duration type is encoded as a string rather than an
         object, where the string ends in the suffix "s" (indicating seconds) and
         is preceded by the number of seconds, with nanoseconds expressed as
         fractional seconds. For example, 3 seconds with 0 nanoseconds should be
         encoded in JSON format as "3s", while 3 seconds and 1 nanosecond should
         be expressed in JSON format as "3.000000001s", and 3 seconds and 1
         microsecond should be expressed in JSON format as "3.000001s".
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: |-
        A Timestamp represents a point in time independent of any time zone or local
         calendar, encoded as a count of seconds and fractions of seconds at
         nanosecond resolution. The count is relative to an epoch at UTC midnight on
         January 1, 1970, in the proleptic Gregorian calendar which extends the
         Gregorian calendar backwards to year one.

         All minutes are 60 seconds long. Leap seconds are "smeared" so that no leap
         second table is needed for interpretation, using a [24-hour linear
         smear](https://developers.google.com/time/smear).

         The range is from 0001-01-01T00:00:00Z to 9999-12-31T23:59:59.999999999Z. By
         restricting to that range, we ensure that we can convert to and from [RFC
         3339](https://www.ietf.org/rfc/rfc3339.txt) date strings.

         # Examples

         Example 1: Compute Timestamp from POSIX `time()`.

             Timestamp timestamp;
             timestamp.set_seconds(time(NULL));
             timestamp.set_nanos(0);

         Example 2: Compute Timestamp from POSIX `gettimeofday()`.

             struct timeval tv;
             gettimeofday(&tv, NULL);

             Timestamp timestamp;
             timestamp.set_seconds(tv.tv_sec);
             timestamp.set_nanos(tv.tv_usec * 1000);

         Example 3: Compute Timestamp from Win32 `GetSystemTimeAsFileTime()`.

             FILETIME ft;
             GetSystemTimeAsFileTime(&ft);
             UINT64 ticks = (((UINT64)ft.dwHighDateTime) << 32) | ft.dwLowDateTime;

             // A Windows tick is 100 nanoseconds. Windows epoch 1601-01-01T00:00:00Z
             // is 11644473600 seconds before Unix epoch 1970-01-01T00:00:00Z.
             Timestamp timestamp;
             timestamp.set_seconds((INT64) ((ticks / 10000000) - 11644473600LL));
             timestamp.set_nanos((INT32) ((ticks % 10000000) * 100));

         Example 4: Compute Timestamp from Java `System.currentTimeMillis()`.

             long millis = System.currentTimeMillis();

             Timestamp timestamp = Timestamp.newBuilder().setSeconds(millis / 1000)
                 .setNanos((int) ((millis % 1000) * 1000000)).build();

         Example 5: Compute Timestamp from Java `Instant.now()`.

             Instant now = Instant.now();

             Timestamp timestamp =
                 Timestamp.newBuilder().setSeconds(now.getEpochSecond())
                     .setNanos(now.getNano()).build();

         Example 6: Compute Timestamp from current time in Python.

             timestamp = Timestamp()
             timestamp.GetCurrentTime()

         # JSON Mapping

         In JSON format, the Timestamp type is encoded as a string in the
         [RFC 3339](https://www.ietf.org/rfc/rfc3339.txt) format. That is, the
         format is "{year}-{month}-{day}T{hour}:{min}:{sec}[.{frac_sec}]Z"
         where {year} is always expressed using four digits while {month}, {day},
         {hour}, {min}, and {sec} are zero-padded to two digits each. The fractional
         seconds, which can go up to 9 digits (i.e. up to 1 nanosecond resolution),
         are optional. The "Z" suffix indicates the timezone ("UTC"); the timezone
         is required. A proto3 JSON serializer should always use UTC (as indicated by
         "Z") when printing the Timestamp type and a proto3 JSON parser should be
         able to accept both UTC and other timezones (as indicated by an offset).

         For example, "2017-01-15T01:30:15.01Z" encodes 15.01 seconds past
         01:30 UTC on January 15, 2017.

         In JavaScript, one can convert a Date object to this format using the
         standard
         [toISOString()](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Date/toISOString)
         method. In Python, a standard `datetime.datetime` object can be converted
         to this format using
         [`strftime`](https://docs.python.org/2/library/time.html#time.strftime) with
         the time format spec '%Y-%m-%dT%H:%M:%S.%fZ'. Likewise, in Java, one can use
         the Joda Time's [`ISODateTimeFormat.dateTime()`](
         http://joda-time.sourceforge.net/apidocs/org/joda/time/format/ISODateTimeFormat.html#dateTime()
         ) to obtain a formatter capable of generating timestamps in this format.
    techaro.lol.reputationdb.fetch.v1.DatabaseVersion:
      type: object
      properties:
        created_at:
          title: Created At
          description: When this version was published, in UTC
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        repo_shasum:
          type: string
          title: Repository Commit SHA
          description: The full hex SHA of the data repository commit this database was built from
        repo_commit_message:
          type: string
          title: Repository Commit Message
          description: The commit message of the data repository commit this database was built from
        version_id:
          type: string
          title: Version ID
          description: 'The identity of the database contents: the unpadded URL-safe base64 encoding of the SHA-512 of the uncompressed database. Republishing identical contents yields the same version ID.'
      title: Database Version
      additionalProperties: false
      description: Metadata about a single published database version, including the data repository commit it was built from.
    techaro.lol.reputationdb.fetch.v1.FetchRequest:
      type: object
      properties:
        version_id:
          type: string
          title: Version ID
          description: The version ID of the database to download, as returned by the list endpoint
      title: Fetch Request
      additionalProperties: false
      description: A request for a download URL for one published database version.
    techaro.lol.reputationdb.fetch.v1.FetchResponse:
      type: object
      properties:
        version:
          title: Version
          description: Metadata about the database version being downloaded
          $ref: '#/components/schemas/techaro.lol.reputationdb.fetch.v1.DatabaseVersion'
        presigned_url:
          type: string
          title: Presigned URL
          description: A presigned GET URL for the zstd-compressed database. It expires, so fetch it again rather than caching the URL itself.
        lifetime:
          title: Lifetime
          description: How long the client should wait before checking for a newer database version
          $ref: '#/components/schemas/google.protobuf.Duration'
      title: Fetch Response
      additionalProperties: false
      description: A time-limited download URL for a database version, plus how long the client should wait before checking for a newer one.
    techaro.lol.reputationdb.fetch.v1.InfoRequest:
      type: object
      properties:
        version_id:
          type: string
          title: Version ID
          description: The version ID of the database to describe, as returned by the list endpoint
      title: Info Request
      additionalProperties: false
      description: A request for metadata about one published database version, without a download URL.
    techaro.lol.reputationdb.fetch.v1.InfoResponse:
      type: object
      properties:
        version:
          title: Version
          description: Metadata about the requested database version
          $ref: '#/components/schemas/techaro.lol.reputationdb.fetch.v1.DatabaseVersion'
      title: Info Response
      additionalProperties: false
      description: Metadata about one published database version.
    techaro.lol.reputationdb.fetch.v1.ListRequest:
      type: object
      title: List Request
      additionalProperties: false
      description: A request for every database version the server currently retains. Takes no parameters.
    techaro.lol.reputationdb.fetch.v1.ListResponse:
      type: object
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/techaro.lol.reputationdb.fetch.v1.DatabaseVersion'
          title: Versions
          description: The retained database versions, ordered newest first and capped at the ten most recent
      title: List Response
      additionalProperties: false
      description: Every database version the server currently retains.
    techaro.lol.reputationdb.free.fetch.v1.FetchRequest:
      type: object
      title: Free Fetch Request
      additionalProperties: false
      description: 'A request for a download URL for the current free datacentre-only database. Takes no parameters: the free tier always serves the latest build rather than a caller-selected version.'
    techaro.lol.reputationdb.free.fetch.v1.FetchResponse:
      type: object
      properties:
        lifetime:
          title: Lifetime
          description: How long the client should wait before checking for a newer database build
          $ref: '#/components/schemas/google.protobuf.Duration'
        version:
          type: string
          title: Version
          description: Identifies the free database build being served, so clients can tell whether they already have it
        presigned_url:
          type: string
          title: Presigned URL
          description: A presigned GET URL for the zstd-compressed datacentre-only database. It expires, so fetch it again rather than caching the URL itself.
        created_at:
          title: Created At
          description: When this free database build was published, so clients can tell how stale it is
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      title: Free Fetch Response
      additionalProperties: false
      description: A time-limited download URL for the current free datacentre-only database build, plus how long the client should wait before checking for a newer one.
    techaro.lol.reputationdb.v1.ListMembership:
      type: object
      properties:
        repository:
          type: string
          title: Repository
          description: Metadata about where this match originates from such as the GitHub repository or third party source that was imported
        list:
          type: string
          title: List
          description: The name of the exact list the IP address was found in
        provider:
          type: string
          title: Provider
          description: The provider or source of this IP address, such as the organization for a manual report or the hosting provider
        category:
          type: string
          title: Category
          description: The main category of this IP address such as abuse, vpn, proxy, etc.
      title: List Membership
      additionalProperties: false
      description: The reason an IP address was added into the database such as the repository it was imported from or the manual report made by an administrator.
    techaro.lol.reputationdb.v1.QueryRequest:
      type: object
      properties:
        ip_addresses:
          type: array
          items:
            type: string
            title: IP addresses
            maximum: 100
            minimum: 1
            description: IP addresses in string format without CIDR prefix
          title: IP addresses
          maximum: 100
          minimum: 1
          description: IP addresses in string format without CIDR prefix
      title: Query Request
      required:
        - ip_addresses
      additionalProperties: false
      description: A batch of IP addresses to look up in the reputation database. Addresses that have no record are omitted from the response instead of being returned empty.
    techaro.lol.reputationdb.v1.QueryResponse:
      type: object
      properties:
        database_created_at:
          title: Database Created At
          description: When the database snapshot that served this query was built, so clients can tell how stale the results are
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        records:
          type: array
          items:
            $ref: '#/components/schemas/techaro.lol.reputationdb.v1.Record'
          title: Records
          description: One record per IP address that was found in the database; requested addresses with no record are omitted
      title: Query Response
      additionalProperties: false
      description: The database records matching the requested IP addresses, along with the age of the database snapshot they were read from.
    techaro.lol.reputationdb.v1.Record:
      type: object
      properties:
        ip_address:
          type: string
          title: IP Address
          description: The IP address for this record (functions as the primary key)
        is_vpn:
          type: boolean
          title: Is VPN
          description: True if the IP address is in a VPN IP list
        is_datacenter:
          type: boolean
          title: Is Datacenter IP
          description: True if the IP address is known to be associated with a datacenter range.
        is_crawler:
          type: boolean
          title: Is Crawler
          description: True if the IP address is a known crawler (good or bad)
        is_proxy:
          type: boolean
          title: Is Open Proxy
          description: True if the IP address is in a known open proxy list
        categories:
          type: array
          items:
            type: string
            title: Categories
            description: All of the categories in every list membership for this IP address
          title: Categories
          description: All of the categories in every list membership for this IP address
        providers:
          type: array
          items:
            type: string
            title: Report Providers
            description: All of the list providers for this IP address
          title: Report Providers
          description: All of the list providers for this IP address
        sources:
          type: array
          items:
            $ref: '#/components/schemas/techaro.lol.reputationdb.v1.ListMembership'
          title: List Memberships
          description: Detailed list membership metadata so administrators can make informed decisions about the risk for an IP address
      title: Database Record
      additionalProperties: false
      description: The database record for an IP address including the categories, providers, and list membership metadata
  securitySchemes:
    APIKey:
      type: http
      description: Thoth API key
      scheme: bearer
      bearerFormat: Paseto
security:
  - APIKey: []
tags:
  - name: techaro.lol.reputationdb.fetch.v1.FetchService
  - name: techaro.lol.reputationdb.free.fetch.v1.FetchService
  - name: techaro.lol.reputationdb.v1.ReputationService
